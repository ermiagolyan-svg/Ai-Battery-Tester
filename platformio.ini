[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

; تنظیم سرعت مانیتور سریال
monitor_speed = 115200

; فعال‌سازی سیستم فایل LittleFS
board_build.filesystem = littlefs

; معرفی کتابخانه‌های خارجی برای دانلود خودکار
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    paulstoffregen/XPT2046_Touchscreen
    bblanchon/ArduinoJson @ ^7.0.4
    robtillaart/INA3221

; تنظیمات سخت‌افزاری نمایشگر و کتابخانه TFT_eSPI
build_flags =
  -D USER_SETUP_LOADED=1
  -D ILI9341_DRIVER=1
  -D TFT_MISO=19
  -D TFT_MOSI=23
  -D TFT_SCLK=18
  -D TFT_CS=32
  -D TFT_DC=15
  -D TFT_RST=13
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D LOAD_FONT6=1
  -D LOAD_FONT7=1
  -D LOAD_FONT8=1
  -D LOAD_GFXFF=1
  -D SPI_FREQUENCY=27000000
  -D SPI_READ_FREQUENCY=20000000
  -D SPI_TOUCH_FREQUENCY=2500000